<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b2f2c">
<title>Sin conexión</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f4f7f6; color: #1d2b2a; padding: 16px; box-sizing: border-box; }
  main { max-width: 360px; text-align: center; }
  img { width: 88px; height: 88px; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { color: #5b6b69; line-height: 1.5; margin: 0 0 20px; }
  button { background: #0f766e; color: #fff; border: 0; border-radius: 6px; padding: 10px 18px; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/logo.svg" alt="">
  <h1>Sin conexión a internet</h1>
  <p>El sistema necesita internet para trabajar con los datos al día. Revisa la conexión y vuelve a intentar.</p>
  <button onclick="location.reload()">Reintentar</button>
</main>
</body>
</html>
